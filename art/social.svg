<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Difflock — diff, analyze and protect your Laravel database schema">
  <title>Difflock</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="55%" stop-color="#191d24"/>
      <stop offset="100%" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#ff9f5a"/>
      <stop offset="75%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#5ed49a"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .dim  { fill: #8a929f; }
      .fg   { fill: #e8ebf0; }
      .crit { fill: #ff6b6b; }
      .ok   { fill: #5ed49a; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#rule)"/>

  <!-- wordmark -->
  <text class="sans" x="80" y="150" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-2">Difflock</text>
  <text class="sans dim" x="80" y="196" font-size="25" letter-spacing="0.2">Diff, analyze and protect your Laravel database schema.</text>

  <!-- the migration that looks fine -->
  <rect x="80" y="248" width="1040" height="196" rx="12" fill="#1b1e24" stroke="#2b3038"/>
  <text class="mono dim" x="106" y="284" font-size="17">Schema::table('users', function (Blueprint $table) {</text>
  <text class="mono fg"  x="106" y="314" font-size="17">    $table-&gt;dropColumn('legacy_token');</text>
  <text class="mono dim" x="106" y="344" font-size="17">});</text>

  <line x1="106" y1="372" x2="1094" y2="372" stroke="#2b3038"/>

  <text class="mono" x="106" y="406" font-size="17">
    <tspan class="crit" font-weight="700">✗ CRITICAL</tspan><tspan class="fg" dx="18">DROP COLUMN users.legacy_token</tspan><tspan class="dim" dx="18">· 82,325 rows · not reversible</tspan>
  </text>

  <!-- the line that sells it -->
  <text class="sans" x="80" y="512" fill="#ffffff" font-size="30" font-weight="600">The migration that passes code review</text>
  <text class="sans" x="80" y="552" fill="#ff6b6b" font-size="30" font-weight="600">and drops a production column.</text>

  <text class="mono dim" x="80" y="600" font-size="18">composer require heyosseus/difflock --dev</text>
  <text class="mono dim" x="1120" y="600" font-size="18" text-anchor="end">MIT · PHP 8.3+ · Laravel 12–13</text>
</svg>
