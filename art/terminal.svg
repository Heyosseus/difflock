<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Difflock terminal output: 14 critical, 125 high findings across 170 migrations">
  <title>php artisan difflock:lint</title>
  <defs>
    <style>
      .bg   { fill: #14161a; }
      .chrome { fill: #1b1e24; }
      .t    { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .dim  { fill: #7c8593; }
      .fg   { fill: #dfe3e9; }
      .b    { fill: #ffffff; font-weight: 700; }
      .crit { fill: #ff6b6b; }
      .high { fill: #ff9f5a; }
      .med  { fill: #f2c14e; }
      .low  { fill: #5aa9e6; }
      .ok   { fill: #5ed49a; }
    </style>
  </defs>

  <rect class="bg" width="920" height="470" rx="10"/>
  <rect class="chrome" width="920" height="34" rx="10"/>
  <rect class="chrome" y="24" width="920" height="10"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text class="t dim" x="460" y="21" text-anchor="middle">php artisan difflock:lint</text>

  <g class="t">
    <text x="26" y="66"><tspan class="dim">$</tspan> <tspan class="fg">php artisan difflock:lint</tspan></text>

    <text class="b" x="26" y="98">Difflock  ·  Migration Analysis</text>
    <text class="dim" x="26" y="114">────────────────────────────────────────</text>

    <text x="26" y="146"><tspan class="crit">✗ CRITICAL</tspan><tspan class="b" x="150"> 14</tspan><tspan class="dim" x="196">drop-column, drop-table</tspan></text>
    <text x="26" y="168"><tspan class="high">✗ HIGH</tspan><tspan class="b" x="150">125</tspan><tspan class="dim" x="196">foreign-key, add-index, rename-column, unindexed-foreign-key</tspan></text>
    <text x="26" y="190"><tspan class="med">⚠ MEDIUM</tspan><tspan class="b" x="150"> 80</tspan><tspan class="dim" x="196">change-column, large-table, drop-index</tspan></text>
    <text x="26" y="212"><tspan class="low">⚠ LOW</tspan><tspan class="b" x="150"> 32</tspan><tspan class="dim" x="196">redundant-index, add-index</tspan></text>

    <text class="b" x="26" y="248">Worst</text>
    <text class="fg" x="42" y="270">DROP COLUMN activity_log.user_id</text>
    <text class="dim" x="58" y="288">2026_01_30_112417_change_user_id…:15  ·  destructive, not reversible</text>
    <text class="fg" x="42" y="312">DROP COLUMN inventory_stocks.available_qty</text>
    <text class="dim" x="58" y="330">2026_04_20_120000_refactor_inventory…:43  ·  destructive, not reversible</text>

    <text class="dim" x="26" y="366">170 migrations analysed · 251 findings.</text>

    <text class="dim" x="26" y="398">→ difflock:lint -v              every finding in full</text>
    <text class="dim" x="26" y="418">→ difflock:lint --rule=NAME     one rule at a time</text>
    <text class="dim" x="26" y="438">→ difflock:report               a shareable HTML report</text>
  </g>
</svg>
