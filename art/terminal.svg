<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="difflock:lint output — 14 critical and 125 high findings across 170 migrations, summarised on one screen">
  <title>php artisan difflock:lint</title>

  <rect width="920" height="470" rx="10" fill="#14161a"/>
  <rect width="920" height="34" rx="10" fill="#1b1e24"/>
  <rect y="24" width="920" height="10" fill="#1b1e24"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text x="460" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7c8593">php artisan difflock:lint</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="26" y="66" fill="#7c8593">$ <tspan fill="#dfe3e9">php artisan difflock:lint</tspan></text>

    <text x="26" y="98" fill="#ffffff" font-weight="700">Difflock  ·  Migration Analysis</text>
    <text x="26" y="114" fill="#4a515c">────────────────────────────────────────</text>

    <text x="26" y="146" fill="#ff6b6b" font-weight="700">✗ CRITICAL</text>
    <text x="150" y="146" fill="#ffffff" font-weight="700">14</text>
    <text x="196" y="146" fill="#7c8593">drop-column, drop-table</text>

    <text x="26" y="168" fill="#ff9f5a" font-weight="700">✗ HIGH</text>
    <text x="150" y="168" fill="#ffffff" font-weight="700">125</text>
    <text x="196" y="168" fill="#7c8593">foreign-key, rename-column, unindexed-foreign-key</text>

    <text x="26" y="190" fill="#f2c14e" font-weight="700">⚠ MEDIUM</text>
    <text x="150" y="190" fill="#ffffff" font-weight="700">80</text>
    <text x="196" y="190" fill="#7c8593">change-column, large-table, drop-index</text>

    <text x="26" y="212" fill="#5aa9e6" font-weight="700">⚠ LOW</text>
    <text x="150" y="212" fill="#ffffff" font-weight="700">32</text>
    <text x="196" y="212" fill="#7c8593">redundant-index, add-index</text>

    <text x="26" y="248" fill="#ffffff" font-weight="700">Worst</text>
    <text x="42" y="270" fill="#dfe3e9">DROP COLUMN activity_log.user_id</text>
    <text x="58" y="288" fill="#7c8593">2026_01_30_112417_change_user_id…:15  ·  destructive, not reversible</text>
    <text x="42" y="312" fill="#dfe3e9">DROP COLUMN inventory_stocks.available_qty</text>
    <text x="58" y="330" fill="#7c8593">2026_04_20_120000_refactor_inventory…:43  ·  destructive, not reversible</text>

    <text x="26" y="366" fill="#7c8593">170 migrations analysed · 251 findings.</text>

    <text x="26" y="398" fill="#5aa9e6">→ difflock:lint -v              <tspan fill="#7c8593">every finding in full</tspan></text>
    <text x="26" y="418" fill="#5aa9e6">→ difflock:lint --rule=NAME     <tspan fill="#7c8593">one rule at a time</tspan></text>
    <text x="26" y="438" fill="#5aa9e6">→ difflock:report               <tspan fill="#7c8593">a shareable HTML report</tspan></text>
  </g>
</svg>
